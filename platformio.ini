; ============================================================
; Rover Comms Module — PlatformIO project
; Phase A: WiFi transport (current)
; Phase B: swap to LoRa transport (see lib/transport/transport_lora.cpp)
; ============================================================

[env:heltec_wifi_lora_32_V3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Build flag to pick which node role this board plays.
; Override per-board via `pio run -e rover` / `pio run -e gcs`,
; or just flip this manually before flashing each board.
build_flags =
    -D NODE_ROLE_ROVER=1
    ; -D NODE_ROLE_GCS=1   ; use this instead when flashing the GCS-side board

; Libraries — WiFi is built into the ESP32 Arduino core (no extra lib needed).
; RadioLib added now so the transport_lora.cpp stub compiles once you're ready
; for Phase B; it is not used by the WiFi transport.
lib_deps =
    jgromes/RadioLib @ ^6.4.2
    bblanchon/ArduinoJson @ ^7.0.4

; Two convenience environments so you can flash each board without
; hand-editing build_flags every time.
[env:rover]
extends = env:heltec_wifi_lora_32_V3
build_flags =
    -D NODE_ROLE_ROVER=1

[env:gcs]
extends = env:heltec_wifi_lora_32_V3
build_flags =
    -D NODE_ROLE_GCS=1

; Native (host-machine) test environment — no ESP32 hardware needed.
; Runs only the protocol/serializer unit tests (test/test_serializer),
; since transport/link_manager/uart_bridge depend on Arduino-specific
; headers (WiFi.h, HardwareSerial) not available on native.
;   Run with: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -D UNIT_TEST

; ------------------------------------------------------------
; Plain ESP32 dev board variants (e.g. WROOM-32 DevKit).
; Same firmware source as the Heltec envs above — only `board`
; differs. Use these if flashing the cheap plain ESP32 boards
; bought for early WiFi-only desk-testing (see BOM discussion).
; Do NOT use these once you move to LoRa (Phase B) unless the
; board has a LoRa radio wired to it manually (RFM95W + SPI).
; ------------------------------------------------------------
[env:rover_plain_esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -D NODE_ROLE_ROVER=1
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4

[env:gcs_plain_esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -D NODE_ROLE_GCS=1
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4